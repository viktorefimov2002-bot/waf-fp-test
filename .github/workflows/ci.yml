name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build runner
        run: go build ./cmd/waf-fp
      - name: Build normalization diagnostic
        run: go build ./cmd/waf-normalization-test
      - name: Build generic corpus importer
        run: go build ./cmd/corpus-import
      - name: Build MGM corpus sync
        run: go build ./cmd/corpus-sync-mgm
      - name: Build HTTPParams importer
        run: go build ./cmd/corpus-import-httpparams
      - name: Build CSIC importer
        run: go build ./cmd/corpus-import-csic
      - name: Build result annotator
        run: go build ./cmd/results-annotate
