mode: differential

target:
  url: https://app.example.test
  path: /api/search

origin:
  url: https://192.0.2.10:443
  host: app.example.test
  sni: app.example.test

request:
  payloads: examples/payloads.txt
  placements: [query, form, json, header, cookie, path]

detection:
  block_statuses: [403, 406]
  block_body_contains: ["access denied", "request rejected"]
  block_body_regex: ["(?i)incident[ _-]*id"]
  block_header_contains: ["Server=pingora", "X-WAF-Action=block"]

execution:
  timeout: 10s
  rechecks: 2
  max_body_bytes: 1048576

output:
  file: results.jsonl
  summary: summary.md
  baseline: ""
  comparison: comparison.md
  fail_on_new_fp: false
