mode: differential

target:
  url: https://app.example.test
  path: /api/search

origin:
  url: https://192.0.2.10:443
  host: app.example.test
  sni: app.example.test

request:
  payloads: examples/corpus.jsonl
  # Set true only after manually validating the endpoint, method, placement,
  # authentication state, and a control request without the tested value.
  context_verified: false
  placements: [query, form, json, header, cookie, path]

detection:
  block_statuses: [403, 406]
  block_body_contains: []
  block_body_regex: []
  block_header_contains: []

execution:
  timeout: 10s
  rechecks: 2
  max_body_bytes: 1048576

output:
  file: results.jsonl
  summary: summary.md
  baseline: ""
  comparison: comparison.md
  fail_on_new_fp: false
