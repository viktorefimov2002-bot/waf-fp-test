mode: differential

target:
  url: https://app.example.test
  path: /api/search

origin:
  url: https://192.0.2.10:443
  host: app.example.test
  sni: app.example.test

request:
  # generic (default), profiles, or both
  mode: generic
  payloads: examples/corpus.jsonl
  placements: [query, form, json, header, cookie, path]
  # Required only for request.mode=profiles or both.
  profiles: examples/request-profiles.jsonl

validation:
  # Optional generic control request. Profiles may also enable it individually.
  control_request: false
  control_value: waf-fp-control

detection:
  block_statuses: [403, 406]
  # Optional installation-specific indicators. Leave empty unless verified.
  block_body_contains: []
  block_body_regex: []
  block_header_contains: []

execution:
  timeout: 10s
  rechecks: 2
  max_body_bytes: 1048576

output:
  file: results.jsonl
  summary: summary.md
  baseline: ""
  comparison: comparison.md
  fail_on_new_fp: false
